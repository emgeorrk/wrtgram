name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test -race ./...

      - name: Build every target
        run: make dist VERSION=${{ github.ref_name }}

      - name: Package tarballs
        run: |
          V='${{ steps.version.outputs.version }}'
          mkdir -p out
          for bin in dist/wrtgram-*; do
            name=${bin#dist/wrtgram-}
            stage=$(mktemp -d)
            cp "$bin" "$stage/wrtgram"
            chmod 755 "$stage/wrtgram"
            mkdir -p "$stage/files"
            cp package/wrtgram/files/* "$stage/files/"
            cp scripts/install.sh README.md LICENSE "$stage/"
            tar -C "$stage" -czf "out/wrtgram-$V-$name.tar.gz" .
            rm -rf "$stage"
          done
          (cd out && sha256sum *.tar.gz > checksums.txt)
          ls -l out

      - name: Release notes
        env:
          PREV: ''
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo 'On the router (as root):'
            echo
            echo '```sh'
            echo 'sh -c "$(wget -qO- https://raw.githubusercontent.com/emgeorrk/wrtgram/main/scripts/install.sh)"'
            echo '```'
            echo
            echo "The installer picks the binary for your architecture, verifies it against checksums.txt and runs the setup wizard."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' ${PREV:+"$PREV.."}"$GITHUB_REF_NAME"
            if [ -n "$PREV" ]; then
              echo
              echo "**Full changelog**: https://github.com/emgeorrk/wrtgram/compare/${PREV}...${GITHUB_REF_NAME}"
            fi
          } > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "$GITHUB_REF_NAME" --notes-file notes.md
