# Builds .ipk/.apk packages with the OpenWrt SDK for a few common
# architectures and attaches them to a release. Best effort: dispatched by
# the release workflow, a failure here never blocks the binary release.
#
# The openwrt/sdk images are thin: /builder/setup.sh downloads the real SDK
# of the image's branch at run time, and the build must not run as root.
name: OpenWrt packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach packages to
        required: true

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64_cortex-a53, branch: openwrt-25.12 }
          - { arch: aarch64_cortex-a72, branch: openwrt-25.12 }
          - { arch: aarch64_generic,    branch: openwrt-25.12 }
          - { arch: arm_cortex-a7_neon-vfpv4, branch: openwrt-25.12 }
          - { arch: mipsel_24kc,        branch: openwrt-25.12 }
          - { arch: mips_24kc,          branch: openwrt-25.12 }
          - { arch: x86_64,             branch: openwrt-25.12 }
          - { arch: aarch64_cortex-a53, branch: openwrt-24.10 }
          - { arch: mipsel_24kc,        branch: openwrt-24.10 }
          - { arch: x86_64,             branch: openwrt-24.10 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build with the OpenWrt SDK
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p out && chmod 777 out
          cat > build.sh <<'SH'
          set -e
          VER="${TAG#v}"
          cd /builder
          ./setup.sh
          ./scripts/feeds update -a
          ./scripts/feeds install golang
          cp -r /src/package/wrtgram package/wrtgram
          sed -i "s|^PKG_VERSION:=.*|PKG_VERSION:=$VER|; s|^PKG_HASH:=.*|PKG_HASH:=skip|" package/wrtgram/Makefile
          # Build the checked-out tree instead of downloading the tag.
          mkdir -p dl
          tar -C /src --exclude=./out --exclude=./.git --exclude=./build.sh \
              --transform "s|^\./|wrtgram-$VER/|" -czf "dl/wrtgram-$VER.tar.gz" .
          make defconfig
          make package/wrtgram/compile -j"$(nproc)" || make package/wrtgram/compile V=s
          find bin/packages -name 'wrtgram*' \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} /src/out/ \;
          ls -l /src/out
          SH
          docker run --rm -e TAG -v "$PWD:/src" "openwrt/sdk:${{ matrix.arch }}-${{ matrix.branch }}" sh /src/build.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cd out
          for f in *; do
            mv "$f" "${f%.*}_${{ matrix.branch }}.${f##*.}"
          done
          gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"
